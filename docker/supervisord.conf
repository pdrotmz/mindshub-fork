[supervisord]
nodaemon=true
user=root

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Descomente se precisar processar filas (queue:work) dentro do mesmo serviço.
; No Render free tier isso compete por CPU/RAM com o Nginx/PHP, então só ative
; se sua fila for leve. Para algo mais sério, crie um "Background Worker"
; separado no Render (pago) ou rode via comando agendado.
;
;[program:queue-worker]
;command=php /var/www/html/artisan queue:work --sleep=3 --tries=3
;autostart=true
;autorestart=true
;stdout_logfile=/dev/stdout
;stdout_logfile_maxbytes=0
;stderr_logfile=/dev/stderr
;stderr_logfile_maxbytes=0